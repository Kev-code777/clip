<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #ytframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<script>
/* Segment player, v4.
   URL:      index.html?v=VIDEO_ID&s=95&e=105
   Options:  &loop=0     play once, reset to start (default loops)
             &mute=0     start with sound (default muted)
             &auto=1     autoplay
             &cookies=1  use www.youtube.com instead of youtube-nocookie.com
             &api=0      plain iframe, no JavaScript control at all (diagnostic)
             &hold=1     restore the old seek-and-pause on load (diagnostic)

   Key difference from v1 to v3: nothing is sent to the player before the user
   presses play. The start position comes from the URL parameter, so the frame
   keeps its normal thumbnail and play button. Segment limits are enforced only
   once playback is actually running.
*/
var q     = new URLSearchParams(location.search);
var VID   = q.get('v');
var START = parseFloat(q.get('s') || '0');
var END   = parseFloat(q.get('e') || String(START + 10));
var LOOP  = q.get('loop') !== '0';
var MUTE  = q.get('mute') !== '0';
var AUTO  = q.get('auto') === '1';
var API   = q.get('api') !== '0';
var HOLD  = q.get('hold') === '1';
var HOST  = q.get('cookies') === '1'
          ? 'https://www.youtube.com'
          : 'https://www.youtube-nocookie.com';
var player, ticker;

if (VID) {
  var src = HOST + '/embed/' + VID +
    '?start=' + Math.floor(START) +
    '&rel=0&modestbranding=1&playsinline=1&fs=1' +
    (MUTE || AUTO ? '&mute=1' : '') +
    (AUTO ? '&autoplay=1' : '') +
    (API ? '&enablejsapi=1&origin=' + encodeURIComponent(location.origin) : '');

  var f = document.createElement('iframe');
  f.id = 'ytframe';
  f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
  f.src = src;
  document.body.appendChild(f);

  if (API) {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
}

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('ytframe', {
    events: { onReady: onReady, onStateChange: onState }
  });
};

function onReady() {
  // Deliberately does nothing by default. Touching the player here is what
  // produced the black frame with no controls.
  if (HOLD) { player.seekTo(START, true); player.pauseVideo(); }
}

function onState(ev) {
  clearInterval(ticker);
  if (ev.data === YT.PlayerState.PLAYING) {
    var t = player.getCurrentTime();
    if (t < START - 1 || t >= END) player.seekTo(START, true);
    ticker = setInterval(watch, 100);
  }
  if (ev.data === YT.PlayerState.ENDED) {
    player.seekTo(START, true);
    if (LOOP) { player.playVideo(); } else { player.pauseVideo(); }
  }
}

function watch() {
  if (!player || !player.getCurrentTime) return;
  if (player.getCurrentTime() >= END) {
    if (LOOP) {
      player.seekTo(START, true);
    } else {
      player.pauseVideo();
      clearInterval(ticker);
    }
  }
}
</script>
</body>
</html>
